  <path d="M147 131L170 192L117 199M382 183L407 200" fill="none" stroke="#d0ae91" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M178 110L318 142" stroke="#8eab94" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="240" y="42" text-anchor="middle" fill="#365d49" font-family="sans-serif" font-size="19">前臂支撑 · 躯干稳定</text>
